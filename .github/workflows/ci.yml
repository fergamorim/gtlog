name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtlog
          POSTGRES_PASSWORD: gtlog
          POSTGRES_DB: gtlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtlog -d gtlog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . --output-format=github
      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gtlog:gtlog@localhost:5432/gtlog_test
        run: pytest -q

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build

  integration:
    name: Integração (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar log de exemplo
        run: python3 scripts/generate_logs.py --lines 5000 --seed 42 --out samples/ci.log
      - name: Build das imagens
        run: docker compose build
      - name: Subir db, api e web
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test full stack
        run: python3 scripts/smoke_test.py --log samples/ci.log
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  # Single check to require in branch protection: it fails when any job above fails or is skipped.
  ci-ok:
    name: CI ok
    if: always()
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Há job que não passou ($r)."
              exit 1
            fi
          done
