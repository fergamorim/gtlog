services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gtlog
      POSTGRES_PASSWORD: gtlog
      POSTGRES_DB: gtlog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtlog -d gtlog"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Only this machine: the database has the default password, and the API reaches it through the compose network.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gtlog:gtlog@db:5432/gtlog
      UPLOAD_MAX_MB: "1024"
      CORS_ORIGINS: http://localhost:5173
      WATCH_ROOT: /watch
      # Lets the UI show and accept full host paths (e.g. /Users/voce/logs/app.log).
      WATCH_HOST_ROOT: ${GTLOG_WATCH_DIR:-}
    volumes:
      # Host folder whose files can be watched live (read-only). Point it elsewhere with GTLOG_WATCH_DIR.
      - ${GTLOG_WATCH_DIR:-./samples}:/watch:ro
    depends_on:
      db:
        condition: service_healthy
    # The API has no authentication: keep it (and the web app) off the local network.
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
